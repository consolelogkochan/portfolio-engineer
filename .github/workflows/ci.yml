name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5      # → @v5 に変更

      - uses: actions/setup-node@v5    # → @v5 に変更
        with:
          node-version: 20
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --prefer-dist --no-progress

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm run format:check

      - run: ./vendor/bin/pint --test

      - run: composer audit

      - run: npm run build

      - run: npx tsx scripts/validate-content.ts
